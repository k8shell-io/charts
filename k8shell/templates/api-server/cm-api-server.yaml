{{- if .Values.apiServer.enabled }}
{{- if not .Values.session.enabled -}}
{{- fail "api-server requires session service" -}}
{{- end -}}
{{- if not .Values.nats.enabled -}}
{{- fail "api-server requires NATS" -}}
{{- end -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: api-server-config
  labels:
    app: api-server
data:
  config.yaml: |
    http:
      port: 9101

      cookie:
        name: k8shell-session
        secure: {{ .Values.frontend.sessionCookie.secure }}
        httpOnly: {{ .Values.frontend.sessionCookie.httpOnly }}
        sameSite: {{ .Values.frontend.sessionCookie.sameSite }}
        maxAgeSeconds: {{ .Values.frontend.sessionCookie.maxAgeSeconds }}
        path: {{ .Values.frontend.sessionCookie.path }}
        domain: .{{ .Values.frontend.host }}

      logging:
        enabled: true
        requestHeaders: {{ .Values.apiServer.logging.requestHeaders }}
        responseHeaders: {{ .Values.apiServer.logging.responseHeaders }}

    nats:
      enabled: {{ .Values.nats.enabled }}
      url: nats://{{ .Values.nats.host }}:{{ .Values.nats.port }}
      username: {{ .Values.nats.username }}
      password: ${NATS_K8SHELL_PASSWORD}

    # local provider allowing to login with username/password
    localProvider:
      enabled: {{ .Values.apiServer.localProvider.enabled }}
      {{- if .Values.frontend.enabled }}
      passwordResetConfirmUrl: {{ .Values.frontend.scheme }}://{{ .Values.frontend.host }}/reset-password/confirm
      {{- end }}

    # JWT verifier configuration for validating tokens from remote identity providers
    jwtVerifier:
      signingMethod: ${JWT_SIGNING_METHOD}
      privateKeyFile: /run/secrets/jwt-issuer/private-key.pem

    # Identity service configuration
    identity:
      address: {{ if and .Values.grpc .Values.grpc.roundRobin }}dns:///identity:9020{{ else }}identity:9020{{ end }}
      tokenFilePath: /var/run/secrets/k8shell.io/identity
      {{- if .Values.certManager.enabled }}
      caCertPath: /etc/k8shell/ca/ca.crt
      serverName: identity.{{ .Release.Namespace }}.svc
      {{- end }}

    # authz service configuration
    authz:
      address: {{ if and .Values.grpc .Values.grpc.roundRobin }}dns:///authz:9011{{ else }}authz:9011{{ end }}
      tokenFilePath: /var/run/secrets/k8shell.io/authz
      {{- if .Values.certManager.enabled }}
      caCertPath: /etc/k8shell/ca/ca.crt
      serverName: authz.{{ .Release.Namespace }}.svc
      {{- end }}


    # Session service configuration
    session:
      address: {{ if and .Values.grpc .Values.grpc.roundRobin }}dns:///session:9010{{ else }}session:9010{{ end }}
      tokenFilePath: /var/run/secrets/k8shell.io/session
      {{- if .Values.certManager.enabled }}
      caCertPath: /etc/k8shell/ca/ca.crt
      serverName: session.{{ .Release.Namespace }}.svc
      {{- end }}

    # Provisioner service configuration
    provisioner:
      address: {{ if and .Values.grpc .Values.grpc.roundRobin }}dns:///provisioner:9030{{ else }}provisioner:9030{{ end }}
      tokenFilePath: /var/run/secrets/k8shell.io/provisioner
      {{- if .Values.certManager.enabled }}
      caCertPath: /etc/k8shell/ca/ca.crt
      serverName: provisioner.{{ .Release.Namespace }}.svc
      {{- end }}

    # SSH proxy service configuration
    sshProxy:
      address: {{ if and .Values.grpc .Values.grpc.roundRobin }}dns:///ssh-proxy:9000{{ else }}ssh-proxy:9000{{ end }}
      tokenFilePath: /var/run/secrets/k8shell.io/ssh-proxy
      {{- if .Values.certManager.enabled }}
      caCertPath: /etc/k8shell/ca/ca.crt
      serverName: ssh-proxy.{{ .Release.Namespace }}.svc
      {{- end }}

    # ssh-shield service configuration
    sshShield:
      address: {{ if and .Values.grpc .Values.grpc.roundRobin }}dns:///ssh-shield:9040{{ else }}ssh-shield:9040{{ end }}
      tokenFilePath: /var/run/secrets/k8shell.io/ssh-shield
      {{- if .Values.certManager.enabled }}
      caCertPath: /etc/k8shell/ca/ca.crt
      serverName: ssh-shield.{{ .Release.Namespace }}.svc
      {{- end }}

    # worksspace client configuration
    k8shelld:
      tokenFilePath: /var/run/secrets/k8shell.io/k8shelld
      {{- if .Values.certManager.enabled }}
      caCertPath: /etc/k8shell/ca/ca.crt
      {{- end }}

    # domain used to build ssh / VS Code Remote connection strings for workspaces
    workspaces:
      sshDomain: {{ .Values.apiServer.workspaces.sshDomain }}
      frontendHost: {{ .Values.apiServer.workspaces.frontendHost }}
{{- end }}