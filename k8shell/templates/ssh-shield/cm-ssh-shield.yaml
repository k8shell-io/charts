{{- if .Values.sshShield.enabled }}
{{- if not .Values.nats.enabled -}}
{{- fail "sshShield requires NATS (set nats.enabled: true)" -}}
{{- end -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: ssh-shield-config
  labels:
    {{- include "k8shell.labels" . | nindent 4 }}
    app.kubernetes.io/component: ssh-shield
data:
  config.yaml: |
    grpc:
      port: 9040

      {{- if .Values.certManager.enabled }}
      enableTLS: true
      certFile: /etc/tls/ssh-shield/tls.crt
      keyFile: /etc/tls/ssh-shield/tls.key
      {{- else }}
      enableTLS: false
      {{- end }}

      # JWT required claims for authentication
      authEnabled: {{ .Values.authEnabled }}
      audience: ssh-shield
      allowed:
        - serviceAccount: api-server

    nats:
      host: {{ .Values.nats.host }}
      port: {{ .Values.nats.port }}
      user: {{ .Values.nats.username }}
      password: !file ${SECRET_FILES}/sshshield_nats_token

      sshFailures:
        subject: {{ .Values.sshShield.sshFailures.subject }}

    blocker:
      window: {{ .Values.sshShield.blocker.window }}
      threshold: {{ .Values.sshShield.blocker.threshold }}
      decreasingThreshold: {{ .Values.sshShield.blocker.decreasingThreshold }}
      idleCleanup: {{ .Values.sshShield.blocker.idleCleanup }}
      banSchedule: {{ toJson .Values.sshShield.blocker.banSchedule }}
      maxIPState: {{ .Values.sshShield.blocker.maxIPState }}
      gcInterval: {{ .Values.sshShield.blocker.gcInterval }}
      {{- if .Values.sshShield.blocker.whitelist }}
      whitelist:
        {{- range .Values.sshShield.blocker.whitelist }}
        - {{ . | quote }}
        {{- end }}
      {{- end }}

    stateStore:
      type: {{ .Values.sshShield.stateStore.type }}
      bucket: {{ .Values.sshShield.stateStore.bucket }}

    plugins:
      {{- range $type, $config := .Values.sshShield.plugins }}
      - type: {{ $type }}
        configFile: plugins/{{ $type }}.yaml
      {{- end }}
{{- end }}
