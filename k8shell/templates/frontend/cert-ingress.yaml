{{- if .Values.frontend.enabled }}
{{- if .Values.certManager.enabled }}
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: ingress-cert
spec:
  secretName: ingress-tls
  {{- if not .Values.certManager.ingressIssuer.name }}
  duration: {{ .Values.certManager.duration }}
  renewBefore: {{ .Values.certManager.renewBefore }}
  {{- end }}
  commonName: {{ .Values.frontend.host }}
  dnsNames:
    - {{ .Values.frontend.host }}
    - "*.{{ .Values.frontend.host }}"
  usages:
    - server auth
  {{- $issuer := .Values.certManager.issuer }}
  {{- if .Values.certManager.ingressIssuer.name }}{{ $issuer = .Values.certManager.ingressIssuer }}{{ end }}
  issuerRef:
    name: {{ $issuer.name }}
    kind: {{ $issuer.kind }}
{{- end }}
{{- end }}