{{- /* The provisioner's own objects (locks, the check for workspaces of
earlier versions) in the target namespace; workspaces run in the
organization namespaces (see clusterrole-org-namespaces.yaml). */ -}}
kind: Role
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: provisioner
  namespace: {{ .Values.provisioner.targetNamespace }}
rules:{{ include "k8shell.provisionerWorkspaceRules" . }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: provisioner
  namespace: {{ .Values.provisioner.targetNamespace }}
subjects:
  - kind: ServiceAccount
    name: provisioner
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: provisioner
  apiGroup: rbac.authorization.k8s.io