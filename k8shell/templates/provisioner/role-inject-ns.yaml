{{- /* explicit inject namespaces: a Role in each; ["*"]: clusterrole-inject.yaml */}}
{{- if and .Values.provisioner.injectNamespaces (not (include "k8shell.clusterWideInjection" .)) }}
{{- range .Values.provisioner.injectNamespaces }}
---
{{- $injectNamespace := . }}
{{- $provisionerNamespace := $.Release.Namespace }}
{{- $nameSuffix := printf "%s-%s" $provisionerNamespace $injectNamespace | sha256sum | trunc 8 }}
{{- $roleName := printf "provisioner-inject-%s-%s" ($provisionerNamespace | trunc 20 | trimSuffix "-") $nameSuffix }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $roleName }}
  namespace: {{ $injectNamespace }}
rules:{{ include "k8shell.provisionerInjectRules" $ }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $roleName }}
  namespace: {{ $injectNamespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $roleName }}
subjects:
- kind: ServiceAccount
  name: provisioner
  namespace: {{ $provisionerNamespace }}
{{- end }}
{{- end }}