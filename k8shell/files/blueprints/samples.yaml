blueprints:
  - name: docker
    description: Docker tools for workspaces with Podman.
    template: base
    image: docker.io/docker:24-cli

    env:
      DOCKER_HOST: "unix:///var/run/podman/podman.sock"

    podman:
      enabled: true
      createDockerSockSymlink: false

  - name: ubuntu
    description: Ubuntu workspace sample.
    template: base
    image: docker.io/ubuntu:latest

  - name: alpine
    description: Alpine workspace sample.
    template: base
    image: docker.io/alpine:latest
