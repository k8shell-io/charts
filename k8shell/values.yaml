# values.yaml for k8shell Helm chart
#
# This file contains the default values for all configurable parameters of the
# k8shell Helm chart. Users can override these values by providing their own
# values.yaml file or by using --set during helm install/upgrade commands.
#
# The chart installs the whole platform: the k8shell services, PostgreSQL
# (postgresql.mode), NATS (nats.install, values under natsServer) and the
# optional identity providers (idpGithub, idpGoogle). Not installed: cert-manager
# (certManager.enabled), the CloudNativePG operator (postgresql.mode cnpg) and
# the Secrets the fields below refer to by secretName.
#
# NOTE on usernames/passwords:
# usernames and passwords are provided as env variables in Pods.
# When a field with name "field1" has a value of {}, there can be following
# options:
#
# 1. field1.value: the actual value will be used to create a Kubernetes secret
#    with key equal to env variable name. For example, see
#    templates/identity/sec-identity.yaml how the secret is created and
#    templates/identity/dep-identity.yaml how the secret is consumed using
#    k8shell.secretEnv helper function.
#
# 2. field1.secretName and field1.secretKey - this will use an existing
#    Kubernetes secret with the specified name and key

# imageRegistry defines a private container registry used to create an image pull secret (regcred).
imageRegistry: 
  host: ""

  # only one of username/password or existingSecret should be set
  username: ""
  password: ""
  existingSecret: ""

# Enable JWT authentication for all services
authEnabled: true

# JWT token expiration time for all services, in seconds
tokenExpiration: 600

# Enable cert-manager to issue TLS certificates for the services.
# This requires cert-manager to be installed in the cluster and a
# ClusterIssuer configured referring a CA issuer such as HashiCorp Vault or
# cert-manager's own CA issuer. If cert-manager is not enabled, TLS will be
# disabled for all services and they will fall back to plaintext communication
certManager:
  enabled: false
  issuer:
    name: vault-root-issuer
    kind: ClusterIssuer
  duration: 24h
  renewBefore: 12h

grpc:
  # enables client-side load balancing for gRPC communication between services.
  # this will make services that expose grpc api to use headless 
  roundRobin: true

# sshProxy is the SSH proxy service that handles incoming SSH connections
sshProxy:
  replicas: 1
  
  image:
    repository: ghcr.io/k8shell-io/ssh-proxy
    tag: v0.18.4
  
  proxyProtocol: false
  
  writerOptions:
    showProvisionInfo: false
    showPulse: true
    showPercentage: true
    showErrors: true
    showSystemErrors: true
  
  serverKey: {}
  
  publishSshFailures:
    enabled: false
    subject: ssh.failures
    publicIPOnly: true
  
  # enable/disable session recording per stream type
  # requires session service to be configured
  recording:
    recordShell: false
    recordExec: false
    recordDirectTCPIP: false

  loadBalancer:
    enabled: false
    annotations: {}
    port: 22

  nodePort:
    enabled: false
    port: 30022

# identity is the authentication and user management service.
identity:
  replicas: 1
  image:
    repository: ghcr.io/k8shell-io/identity
    tag: v0.18.4

  # jwtIssuer configures JWT token issuance for k8shell services.
  jwtIssuer:
    # expiry is the lifetime of issued JWT tokens
    expiry: 60m
    # privateKey is the RSA/EC private key used to sign JWT tokens
    privateKey: {}
    # signingMethod is the algorithm used to sign JWT tokens (e.g. RS256, ES256)
    signingMethod: {}

  # kubernetes configures identity's integration with the Kubernetes API.
  kubernetes:
    # saToken configures on-demand service-account token issuance via the Kubernetes TokenRequest API.
    saToken:
      # enabled controls whether GetUserCredential issues Kubernetes service account tokens
      enabled: true
      # ttl is the requested token lifetime (minimum 10m, Kubernetes enforced)
      ttl: 1h
      # audiences are embedded in issued tokens
      audiences:
        - https://kubernetes.default.svc.cluster.local

  # passwordLockout configures brute-force lockout for local username/password
  # login. Keyed by username in identity's own NATS KV storage; has no effect
  # when nats.enabled is false.
  passwordLockout:
    # maxAttempts is the number of consecutive failed password attempts
    # before an account is locked.
    maxAttempts: 5
    # lockDuration is how long an account stays locked once maxAttempts is
    # reached.
    lockDuration: 15m

  # smtp configures the SMTP relay used for password-reset email and
  # announcement email. Disabled by default; when disabled (or unreachable),
  # RequestPasswordReset logs and swallows the failure and still reports
  # success to callers.
  smtp:
    enabled: false
    host: {}
    port: {}
    username: {}
    password: {}
    from: {}

  # passwordReset configures the password-reset token lifecycle, stored in
  # identity's own NATS KV storage. Has no effect when nats.enabled is false.
  passwordReset:
    # tokenTTL bounds how long an issued reset link stays valid.
    tokenTTL: 1h
    # cooldownDuration is how long a username must wait between
    # RequestPasswordReset calls before a new one actually sends email.
    cooldownDuration: 60s

  # announcementEmail configures the periodic sender that emails active,
  # email_enabled announcements to users who both match the announcement's
  # org/role targeting and have opted in (announcementsByEmail, in their own
  # user_settings). Reuses the smtp relay above.
  announcementEmail:
    # interval is how often the sender checks for eligible announcements and
    # candidates.
    interval: 15m
    # sendHour is the hour of day (0-23, in timezone) at or after which sends
    # are allowed to start on an announcement's activation day (its
    # starts_at, or created_at when starts_at is unset).
    sendHour: 9
    # timezone sendHour and each announcement's activation day are evaluated
    # in (IANA name).
    timezone: UTC
    # subjects maps a language (resolved from a candidate's own
    # user_settings "language" key) to the email subject line used for that
    # language. A language with no entry falls back to subjects.en, then to
    # a fixed generic subject.
    subjects:
      en: New k8shell announcement
      cs: Nové oznámení k8shell

  # mailRateLimit caps total outbound email volume (summed across
  # password-reset and announcement email) in a trailing 24h window. 0
  # disables the cap. Set this when smtp above points at a rate-limited
  # relay.
  mailRateLimit:
    # dailyRecipientCap is the max number of email recipients allowed in a
    # trailing 24h window. 0 disables the cap.
    dailyRecipientCap: 0

  # roles are global roles created at startup if missing, besides the built-in
  # admin and org-admin. The default policies give developer inject mode and
  # git-workspace the repositories and git workspaces of external identity
  # providers. Existing roles are left untouched.
  roles:
    - name: developer
      description: Inject workspaces into existing workloads
    - name: git-workspace
      description: Repository catalog and git-sourced workspaces of the identity provider

  # organizations are created at startup if missing; no organization is built
  # in. nodeSelectors (label key -> value) place the workspaces of an
  # organization's users and are set only while the organization has none, so
  # changes made in the admin UI are kept; without any, an admin must set them
  # before its users can start workspaces. roles are organization-scoped roles
  # (admin and org-admin cannot be declared here: they are global).
  organizations:
    - name: default
      description: Default organization
      nodeSelectors:
        kubernetes.io/os: linux
      roles: []

  # users are local users (identity's user file). organization is required and
  # must be one of the organizations above; each user gets an onboarding rule
  # with its organization, roles and sudo.
  users:
    - username: "admin"
      uid: 1001
      gid: 1001
      fullname: "Administrator"
      email: "admin@k8shell"
      blueprints: ["*"]
      sudo: true
      shell: /bin/bash
      # developer: may also inject workspaces into existing workloads
      roles: [admin, developer]
      organization: "default"
      password: ""  
      publicKey: ""

    # additional users can be added in the same format as above
    # - username: "alice"
    #   uid: 1002
    #   gid: 1002
    #   fullname: "Alice"
    #   email: "alice@k8shell"
    #   blueprints: ["*"]
    #   sudo: false
    #   shell: /bin/bash
    #   roles: [developer]
    #   organization: "default"
    #   password: ""
    #   publicKey: ""

  # onboardRules is a list of explicit allow/deny/waitlist rules matched against
  # incoming users from remote identity providers during onboarding. Users no
  # rule allows are rejected. The users above get an allow rule automatically
  # (provider idp.k8shell.io/file, with their organization, roles and sudo).
  onboardRules: []
    # - idp: "idp.k8shell.io/github"
    #   usernamePattern: "bobmarley"
    #   org: default
    #   action: allow
    #   sudo: true
    #   roles: ["admin"]

  # list of remote identity providers running in the cluster that the identity
  # service can delegate authentication to. Provide the list in the following
  # format (idp-github is an example and should be replaced with the actual
  # service name of the remote provider in the cluster):
  # remoteProviders:
  #   - address: idp-github:9030
  #     serverName: idp-github.<namespace>.svc

# authz is the authorization service that evaluates OPA policies.
authz:
  enabled: true
  replicas: 1
  image:
    repository: ghcr.io/k8shell-io/authz
    tag: v0.3.3

  # policiesConfigMap is the name of an existing ConfigMap whose keys are
  # mounted as policy files (*.rego) into /app/policies, replacing the chart's
  # default policies. Empty: the chart creates the ConfigMap
  # authz-policies-default from files/policies/. The default policies hold no
  # site-specific settings: what users may do follows from their roles
  # (admin, org-admin, <group>-admin, developer for inject mode,
  # git-workspace for repositories). A replacement must hold the complete
  # policy set (copy the chart's files/policies/ as a starting point).
  policiesConfigMap: ""

  # defaultPolicy is the inline OPA Rego policy used when no policy file matches.
  defaultPolicy: |
    package authz
    import rego.v1
    default allow = false

  enrichment:
    user:
      timeout: 2s
      cacheTTL: 30s

  # audit configuration for authz service. Audit is written to the db
  # when db is enabled.
  audit:
    retention: 720h   
    bufferSize: 2000
    flushInterval: 200ms
    dedupWindow: 30s

# provisioner manages the lifecycle of k8shell workspace pods.
provisioner:
  replicas: 1
  image:
    repository: ghcr.io/k8shell-io/provisioner
    tag: v0.17.8

  # k8shelld is the default image for k8shelld defined in base blueprint
  k8shelld:
    image:
      repository: ghcr.io/k8shell-io/k8shelld
      tag: v0.17.3

  # blueprintsConfigMap is the name of an existing ConfigMap with blueprint
  # files that replaces the chart's defaults (the ConfigMap blueprint-base-files
  # with files/blueprints/base.yaml and, with includeBlueprintSamples,
  # samples.yaml). A replacement must define the "base" template if any of its
  # blueprints (or those of blueprintFilesConfigMaps) extend it.
  blueprintsConfigMap: ""

  # if true, the sample blueprints (samples.yaml) will be included alongside
  # the base blueprints (base.yaml). Only used without blueprintsConfigMap.
  includeBlueprintSamples: true

  # defaultCustomBlueprint is the default blueprint when custom blueprint
  # does not exist in a git repository. Empty: "git-dev" when a git identity
  # provider (idpGithub) is enabled, otherwise "base".
  defaultCustomBlueprint: ""

  # optional list of ConfigMaps with additional blueprint files, mounted into
  # /app/blueprints together with the defaults (or blueprintsConfigMap); the
  # git-blueprints ConfigMap is added automatically when idpGithub is enabled.
  # File names must be unique across all of them, blueprint names across all
  # files (the provisioner refuses duplicates).
  blueprintFilesConfigMaps: []

  # targetNamespace is the namespace where provisioner will create workspaces.
  # if not set, helm chart installation will fail.
  targetNamespace: ""

  # Rate limit for the in-cluster Kubernetes client used for all workspace
  # pod/release lookups and mutations. Defaults to 150 QPS / 300 burst when
  # omitted (client-go itself defaults to 5 QPS / 10 burst, which throttles
  # this process client-side under concurrent request load).
  # kubeClient:
  #   qps: 150
  #   burst: 300

  # Namespaces where workspace injection is allowed.
  # If omitted or empty, injection is disabled and all inject requests are rejected.
  # Use explicit namespace names for Role-scoped operation.
  # When you use ["*"] cluster-wide discovery/injection will be granted (ClusterRole).
  # injectNamespaces:
  #   - default

  # Node label keys whose values are discovered from cluster nodes and offered as
  # placement options (see the GetNodeSelectorOptions RPC). When non-empty, a
  # ClusterRole granting get/list/watch on nodes is created for the provisioner.
  # Set to [] to disable node discovery.
  nodeSelectorKeys:
    - k8shell.io/pool

  # defaultRegistry is the default registry host for workspace images when no
  # registry is specified in a blueprint.
  defaultRegistry:
    host: ""

  # privateRegistry is a private registry with credentials for workspace images.
  # When enabled, the image pull secret will be created from the provided credentials
  privateRegistry:
    enabled: false
    host: {}
    username: {}
    password: {}
    cert: {}

  nats:
    # provisionBucketTTL is the TTL for entries in the NATS KV provisioning bucket
    provisionBucketTTL: 48h

  # shells configures PTY shell session behavior for k8shell workspaces.
  shells:
    # allowSessionDetach controls whether clients can detach from PTY shell sessions
    # (and reattach to them); the web terminal needs it
    allowSessionDetach: true
    # detachedTTL is how long a detached session is kept alive before automatic termination
    detachedTTL: "30m"
    # allowUnlimittedTTL allows clients to set unlimited TTL for detached sessions
    allowUnlimittedTTL: false

  # saToken configures the SA token credential helper for workspace Kubernetes access.
  saToken:
    # enabled controls whether the SA token credential helper is active
    enabled: true
    # cacheTokens controls whether retrieved tokens are cached to avoid redundant API server calls
    cacheTokens: false

  # extra environment variables to inject into the provisioner pod.
  # names must not conflict with reserved variables:
  # DEFAULT_REGISTRY_HOST, PRIVATE_REGISTRY_HOST, PRIVATE_REGISTRY_USERNAME,
  # PRIVATE_REGISTRY_PASSWORD, NATS_K8SHELL_PASSWORD, JWT_SIGNING_METHOD, DEFAULT_K8SHELLD_IMAGE
  extraEnv: []
  # - name: MY_VAR
  #   value: "my-value"



# frontend serves the k8shell web UI.
frontend:
  enabled: true
  replicas: 1
  image:
    repository: ghcr.io/k8shell-io/frontend
    tag: v0.18.3
  scheme: "http"
  host: "localtest.me"
  sessionCookie:
    secure: false
    httpOnly: true
    sameSite: Strict
    maxAgeSeconds: 86400
    path: /api/v1
  features:
    # web UI navigation (sidebar): off, short or full
    navigation: full

# apiServer provides the k8shell REST API.
apiServer:
  enabled: true
  replicas: 1
  image:
    repository: ghcr.io/k8shell-io/api-server
    tag: v0.19.4
  logging:
    requestHeaders: false
    responseHeaders: false
  localProvider:
    enabled: false

  # infraVersionsConfigMap is the name of an existing ConfigMap holding version
  # info for infra services (e.g. postgresql, nats), mounted into api-server at
  # /app/infra-versions. Empty: the chart's own k8shell-infra-versions, with the
  # versions of the PostgreSQL and NATS it installs.
  infraVersionsConfigMap: ""

  # workspaces configures the domain used to build ssh / VS Code Remote connection strings for workspaces.
  workspaces:
    sshDomain: app.k8shell.dev
    frontendHost: https://app.k8shell.dev

# session manages terminal session state and recording.
session:
  enabled: true
  replicas: 1
  image:
    repository: ghcr.io/k8shell-io/session
    tag: v0.15.2

  # Janitor ends sessions that stop sending upserts (e.g. client killed).
  # pg_try_advisory_lock ensures only one replica runs the sweep at a time.
  janitor:
    ttl: 5m
    interval: 1m
    batchSize: 100

  # Recording stores terminal sessions as asciinema v2 (.cast) files.
  recording:
    enabled: false
    gzip: false
    persistentVolumeClaim:
      install: false
      storageClassName: ""
      size: 10Gi
      annotations: {}

# sshShield provides SSH brute-force protection by consuming SSH failure
# events over NATS (published by sshProxy.publishSshFailures) and banning
# offending IPs. Requires nats.enabled: true.
sshShield:
  enabled: false
  replicas: 1
  image:
    repository: ghcr.io/k8shell-io/ssh-shield
    tag: v0.13.2

  # NATS subject to subscribe to for SSH failure events.
  # Must match sshProxy.publishSshFailures.subject.
  sshFailures:
    subject: ssh.failures

  blocker:
    # sliding window for counting hits from the same IP
    window: 5m
    # number of hits within the sliding window to trigger a ban
    threshold: 4
    # if true, threshold decreases with each strike
    decreasingThreshold: true
    # time to remove IP state after no hits
    idleCleanup: 12h
    # durations for escalating bans based on number of strikes
    banSchedule: [1m, 5m, 15m, 1h, 6h, 24h, 72h]
    # garbage collection settings
    maxIPState: 100000
    gcInterval: 10m
    # IP whitelist — list of CIDR ranges to never ban
    whitelist: []

  # state store for per-IP rate-limit state, backed by NATS JetStream KV so
  # state is shared across replicas
  stateStore:
    type: nats-kv
    bucket: ssh-shield-state

  # blocker plugins — keys are plugin types, values are that plugin's config
  plugins:
    nfgate:
      # address of the nfgate gRPC endpoint
      address: "localhost:9090"
      # set to true to enable TLS on the gRPC connection
      tls: false
      # maximum time to wait when dialing the gRPC endpoint
      dialTimeout: 5s
      # authKey is the shared secret sent as "Authorization: Bearer <key>" in
      # every gRPC call. Must match the authKey configured on the nfgate server.
      authKey: {}


# postgresql is the database of identity, session, provisioner, authz and the
# identity providers.
postgresql:
  enabled: true
  # mode decides who runs the database:
  #   simple:   the chart runs a single PostgreSQL instance (StatefulSet with
  #             one pod), no prerequisites; no HA, no built-in backups
  #   cnpg:     the chart creates a CloudNativePG Cluster (HA, failover);
  #             the CloudNativePG operator must be installed
  #   external: an existing server at host:port, nothing is installed
  mode: simple
  # simple/cnpg: the Service the chart creates for the primary
  host: "db-postgresql"
  port: 5432
  database: "postgres"
  # credentials of the k8shell services; simple mode creates this user as the
  # superuser, cnpg mode expects the superuser "postgres" (see cnpg below)
  username: {}
  password: {}
  resources: {}

  simple:
    image:
      repository: postgres
      tag: "18"
    persistence:
      # false: emptyDir, the data is lost when the pod is deleted
      enabled: true
      # an existing PVC to use instead of the one the chart creates
      existingClaim: ""
      # empty: the cluster's default StorageClass
      storageClassName: ""
      size: 10Gi
      annotations: {}
    # node selection for the database pod (its volume may be node-local)
    nodeSelector: {}
    tolerations: []
    affinity: {}

  cnpg:
    instances: 3
    # empty = operator default image
    imageName: ""
    # kubernetes.io/basic-auth Secret with username "postgres" and the password
    # of postgresql.password, created outside the chart
    superuserSecret: db-postgresql-superuser
    storage:
      storageClassName: ""
      size: 20Gi
    # "preferred" spreads instances over nodes when possible, "required" insists
    podAntiAffinityType: preferred
    # postgresql.conf parameters
    parameters: {}
    # e.g. { method: any, number: 1 } for quorum synchronous replication;
    # empty = asynchronous replicas
    synchronous: {}
    # replaces the default initdb bootstrap, e.g. initdb.import or recovery
    bootstrap: {}
    externalClusters: []

  # additional NodePort Service to the primary (simple and cnpg modes)
  nodePort:
    enabled: false
    port: ""

# nats is the message broker used for inter-service communication and KV storage.
nats:
  enabled: true
  # install the NATS server (subchart, values under natsServer); false: use an
  # existing server at host:port
  install: true
  host: "nats"
  port: 4222
  # the user the k8shell services connect as; natsServer's auth.conf defines it
  username: "k8shell-service"
  # with nats.install the NATS server reads the password from the same Secret:
  # .value -> the chart's Secret int-nats (natsServer default); .secretName ->
  # set natsServer.container.env.NATS_K8SHELL_PASSWORD to the same Secret/key
  password: {}

# natsServer configures the NATS server installed with nats.install: values of
# the official chart (https://github.com/nats-io/k8s/tree/main/helm/charts/nats).
# The defaults run a cluster of 3 servers with JetStream on 10Gi volumes: the
# k8shell services create JetStream KV buckets with 3 replicas, which a single
# server refuses.
natsServer:
  fullnameOverride: nats
  container:
    image:
      repository: nats
      tag: "2.11.9-alpine"
    env:
      NATS_K8SHELL_PASSWORD:
        valueFrom:
          secretKeyRef:
            name: int-nats
            key: NATS_K8SHELL_PASSWORD
  config:
    cluster:
      enabled: true
      replicas: 3
    merge:
      $include: auth.conf
    jetstream:
      enabled: true
      fileStore:
        enabled: true
        pvc:
          enabled: true
          size: 10Gi
          # storageClassName: ""
  configMap:
    merge:
      data:
        auth.conf: |
          authorization: {
            users: [
              {
                user: "k8shell-service",
                password: $NATS_K8SHELL_PASSWORD,
                permissions: {
                  subscribe: { allow: [">"] },
                  publish: { allow: [">"] }
                }
              },
            ]
          }
  natsBox:
    enabled: true
  statefulSet:
    merge:
      spec:
        persistentVolumeClaimRetentionPolicy:
          whenDeleted: Delete

# idpGithub is the GitHub identity provider (users sign in with GitHub, through
# a GitHub App). It uses the settings above (certManager, grpc, authEnabled,
# imageRegistry, nats, postgresql) and is added to identity.remoteProviders
# automatically.
idpGithub:
  enabled: false
  replicas: 1
  image:
    repository: ghcr.io/k8shell-io/idp-github
    tag: v0.14.3

  github:
    # client ID/secret of the GitHub App
    clientId: {}
    clientSecret: {}
    appSlug: "k8shell-io"

    # onboardRules is a list of explicit allow/deny/waitlist rules matched against
    # incoming GitHub users before onboardRuleTemplate is applied.
    onboardRules: []
      # - username: "bobmarley"
      #   sudo: true
      #   roles: ["admin"]
      #   action: "allow"

    # onboardRuleTemplate is the fallback rule applied to users not matched by onboardRules.
    # Stored as a raw string to preserve !cel tags (Helm's YAML parser strips custom tags).
    onboardRuleTemplate: |
      username: !cel "user.login"
      fullname: !cel "has(user.name) && user.name != null ? user.name : ''"
      uid: !cel "uint(user.id)"
      gid: !cel "uint(user.id)"
      email: !cel |
         emails.exists(e, e.primary == true)
          ? emails.filter(e, e.primary == true)[0].email
          : "unknown@nowhere.com"

  # githubUserTemplate is used to map the user from github to the k8shell user.
  # Stored as a raw string to preserve !cel tags (Helm's YAML parser strips custom tags).
  githubUserTemplate: |
    user:
      username: !cel "user.login"
      fullname: ""
      uid: !cel "100000 + int(user.id)"
      gid: !cel "100000 + int(user.id)"
      email: !cel |
        emails.exists(e, e.primary == true)
          ? emails.filter(e, e.primary == true)[0].email
          : "unknown@nowhere.com"
      auths: [publickey]
      blueprints: ["*"]
      roles: ["workspace-user"]
      isValid: true
      shell: "/bin/bash"
      sudo: true
      organization: "github"

# idpGoogle is the Google identity provider (Google Workspace and, optionally,
# personal Google accounts). Like idpGithub it uses the shared settings above
# and is added to identity.remoteProviders automatically.
idpGoogle:
  enabled: false
  replicas: 1
  image:
    repository: ghcr.io/k8shell-io/idp-google
    # as in the idp-google chart 0.1.1 (no release tag yet)
    tag: pr-1-4952aba

  google:
    # OAuth 2.0 "Web application" client from Google Cloud Console (APIs & Services >
    # Credentials). Its authorized redirect URIs must include the URI the identity
    # client passes to OnboardUserWebFlow.
    clientId: {}
    clientSecret: {}

    # --- Who may sign in (hard gate, evaluated before the template below) ---------
    # Google Workspace domains ("hd" claim) that may sign in. "*" admits any Workspace.
    allowedDomains: []

    # Personal Google accounts (no "hd" claim, e.g. @gmail.com). Off by default.
    allowPersonal: false
    # Email domains accepted for personal accounts (default: gmail.com, googlemail.com).
    personalEmailDomains: []
    # Narrow personal sign-in to exactly these addresses (empty = any personal account).
    personalAllowedEmails: []

    # --- What an admitted user gets -------------------------------------------------
    # Fixed rules per username (the username the template produces), taking priority
    # over the template. They never bypass the gate above.
    onboardRules: []

    # onboardRuleTemplate is the fallback rule applied to admitted users.
    # Stored as a raw string to preserve !cel tags (Helm's YAML parser strips custom tags).
    # See the idp-google chart for the CEL scope (claims, personal, uid, emailLocal,
    # emailDomain, emailProvider).
    onboardRuleTemplate: |
      username: !cel "emailLocal"
      fullname: !cel "claims.name"
      email: !cel "claims.email"
      uid: !cel "uid"
