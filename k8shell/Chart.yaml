apiVersion: v2
name: k8shell
description: A Helm chart for k8shell platform
version: 2.0.1
appVersion: 26.11.2
dependencies:
  # NATS server installed with k8shell (nats.install); its values are under
  # natsServer, see values.yaml
  - name: nats
    alias: natsServer
    version: 1.3.14
    repository: https://nats-io.github.io/k8s/helm/charts/
    condition: nats.install
