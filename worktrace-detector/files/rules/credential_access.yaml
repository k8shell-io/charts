rules:
  # --- Kubernetes secret enumeration ---
  - id: "credaccess-kubectl-get-secrets"
    name: "kubectl get secrets from workspace"
    description: "Detects kubectl get secrets execution inside a workspace, indicating K8s secret enumeration"
    report: true
    confidence: 0.70
    process: "kubectl"
    args: ["get", "secret"]

  - id: "credaccess-kubectl-describe-secret"
    name: "kubectl describe secret from workspace"
    description: "Detects kubectl describe secret execution inside a workspace"
    report: true
    confidence: 0.70
    process: "kubectl"
    args: ["describe", "secret"]

  # --- Service Account token file access ---
  - id: "credaccess-sa-token-file-read"
    name: "Access to default service account token"
    description: "Detects access to the mounted service account token file, which can be used for K8s API authentication"
    report: false
    confidence: 0.30
    file: "/var/run/secrets/kubernetes.io/serviceaccount/token"

  - id: "credaccess-sa-ca-cert-read"
    name: "Access to service account CA certificate"
    description: "Detects access to the mounted CA certificate, combined with token access indicates K8s API targeting"
    report: false
    confidence: 0.30
    file: "/var/run/secrets/kubernetes.io/serviceaccount/ca.crt"

  # --- Kubeconfig and cloud credential files ---
  - id: "credaccess-kubeconfig-read"
    name: "Access to kubeconfig files"
    description: "Detects access to kubeconfig files which contain cluster credentials"
    report: true
    confidence: 0.80
    file: ["/.kube/config", "/etc/kubernetes/admin.conf", "/etc/kubernetes/kubelet.conf"]

attack_paths:
  - id: "credaccess_kubectl_secret_enum"
    name: "Kubernetes secret enumeration via kubectl"
    description: "Multiple kubectl secret-related commands from a workspace in a short period"
    time_window: "5m"
    rules:
      - "credaccess-kubectl-get-secrets"
      - "credaccess-kubectl-describe-secret"
