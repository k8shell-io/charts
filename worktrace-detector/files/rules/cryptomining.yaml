rules:
  # --- Known miner binary names ---
  - id: "cryptomine-known-miner-exec"
    name: "Known cryptominer binary execution"
    description: "Detects execution of known cryptominer binaries (xmrig, minerd, cpuminer, etc.)"
    report: true
    confidence: 0.95
    process: ["xmrig", "minerd", "cpuminer", "cpuminer-multi", "minergate-cli", "kdevtmpfsi", "kinsing"]

  # --- Mining pool connection indicators ---
  - id: "cryptomine-stratum-protocol"
    name: "Stratum mining pool protocol connection"
    description: "Detects process execution with stratum:// or stratum+tcp:// arguments, indicating mining pool connection"
    report: true
    confidence: 0.95
    process: ["xmrig", "minerd", "cpuminer", "curl", "wget"]
    args_match: "any"
    args: ["stratum://", "stratum+tcp://", "stratum+ssl://"]
