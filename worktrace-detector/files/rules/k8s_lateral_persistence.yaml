rules:
  - id: "nsenter-full-escape"
    name: "nsenter entering all host namespaces"
    description: "Detects nsenter with -a or --all flag targeting PID 1, which enters all host namespaces and provides a full root shell on the node"
    report: true
    confidence: 0.95
    process: "nsenter"
    args_match: "all"
    args: ["-t", "1"]

  - id: "kubelet-sa-token-read"
    name: "Access to projected service account token from kubelet pods directory"
    description: "Detects access to projected service account token files under /var/lib/kubelet/pods/.../volumes/kubernetes.io~projected/.../token, indicating post-escape lateral movement"
    report: true
    confidence: 0.80
    file: "/var/lib/kubelet/pods/*/volumes/kubernetes.io~projected/*/*/token"

  - id: "rke2-static-pod-manifest"
    name: "Access to RKE2 static pod manifests directory"
    description: "Detects access to /var/lib/rancher/rke2/agent/pod-manifests, which can be used for persistence via static pods after a container escape"
    report: true
    confidence: 0.85
    file: "/var/lib/rancher/rke2/agent/pod-manifests"

attack_paths:
  - id: "k8s3-nsenter-token-harvest"
    name: "Node escape via nsenter followed by service account token harvesting"
    description: "nsenter full namespace escape from a privileged+hostPID workspace pod, followed by access to projected service account tokens on the host filesystem"
    time_window: "10m"
    rules:
      - "nsenter-full-escape"
      - "kubelet-sa-token-read"

  - id: "k8s3-nsenter-static-pod-persistence"
    name: "Node escape via nsenter followed by static pod persistence"
    description: "nsenter full namespace escape from a privileged+hostPID workspace pod, followed by access to RKE2 static pod manifests for persistence"
    time_window: "10m"
    rules:
      - "nsenter-full-escape"
      - "rke2-static-pod-manifest"
