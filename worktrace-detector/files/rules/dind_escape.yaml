  # --- rules for privileged container creation ---

rules:
  - id: "dind-docker-run-priv"
    name: "Privileged container runtime run"
    description: "Detects docker run --privileged inside a workspace container"
    report: false
    confidence: 0.90
    process: "docker"
    args: ["run", "--privileged"]

  # we could also filter by arg index 3 (dev) for value 2050 (8:2 = /dev/sda2)
  - id: "dind-mknod-dev"
    name: "Device node creation under /dev"
    description: "Detects mknodat creating device nodes under /dev/, indicating the container runtime is populating devices inside a privileged container. Fires from runc in the DinD container's cgroup."
    report: true
    confidence: 0.80
    syscall:
      name: ["sys_mknodat"]
      args:
        - index: 1
          type: "string"
          values: ["/dev/sd"]
          match: "contains_any"
      selectors:
        matchBinaries:
          - operator: "In"
            values:
              - "/usr/local/bin/runc"
              - "/usr/bin/runc"

  - id: "dind-mount-host-block-device"
    name: "Mount of likely host block device"
    description: "Detects mount of /dev/sd*, /dev/nvme*, or /dev/vd* devices from within a workspace"
    report: false
    confidence: 0.50
    global: true
    syscall:
      name: ["sys_mount"]
      args:
        - index: 0
          type: "string"
          values: ["/dev/sd", "/dev/nvme", "/dev/vd"]
          match: "contains_any"

  - id: "escape-procfs-access"
    name: "Suspicious /proc access pattern"
    description: "Process accessing /proc/[pid]/exe or /proc/self/fd which could indicate CVE-2019-5736 style escape via host binary overwrite"
    report: false
    confidence: 0.30
    file: ["/proc/*/exe", "/proc/self/fd/*", "/proc/*/root/*"]



attack_paths:
  - id: "dind_escape_device_mount"
    name: "DIND escape via device nodes and mount"
    description: "creation of device nodes under /dev in a container, followed by a mount of a host block device"
    time_window: "10m"
    rules:
      - "dind-mknod-dev"
      - "dind-mount-host-block-device"

  - id: "procfs_escape"
    name: "Container escape via /proc manipulation"
    description: "Privileged container creation followed by suspicious /proc access, indicating CVE-2019-5736 style escape"
    time_window: "10m"
    rules:
      - "dind-mknod-dev"
      - "escape-procfs-access"

  - id: "dind_privileged_container"
    name: "DIND priviled container creation"
    description: "Syscall-level detection of privileged container creation: Docker socket write with privileged flag and device node population under /dev"
    time_window: "1m"
    rules:
      - "dind-docker-run-priv"
      - "dind-mknod-dev"

