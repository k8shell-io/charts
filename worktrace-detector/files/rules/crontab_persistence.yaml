rules:
  - id: "persist-crontab-edit"
    name: "Crontab modification from workspace"
    description: "Detects crontab -e or crontab invocation that modifies cron schedules from within a workspace"
    report: true
    confidence: 0.60
    process: "crontab"
    args_match: "any"
    args: ["-e", "-l", "-r"]

  - id: "persist-cron-file-access"
    name: "Access to cron spool or /etc/crontab"
    description: "Detects access to cron configuration files on the host, indicating scheduled task persistence"
    report: true
    confidence: 0.60
    file: ["/etc/crontab", "/etc/cron.d/", "/var/spool/cron/"]

  - id: "persist-at-command"
    name: "at command execution for delayed task scheduling"
    description: "Detects use of the at command for scheduling one-time tasks, a persistence mechanism"
    report: false
    confidence: 0.40
    process: "at"

  # --- systemd timer/service persistence ---
  - id: "persist-systemd-unit-access"
    name: "Access to systemd unit files from workspace"
    description: "Detects access to systemd service/timer unit files, indicating service-level persistence"
    report: true
    confidence: 0.70
    file: ["/etc/systemd/system/", "/usr/lib/systemd/system/", "/run/systemd/system/"]
