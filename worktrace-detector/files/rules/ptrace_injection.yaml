rules:
  - id: "ptrace-sys-ptrace-attach"
    name: "ptrace PTRACE_ATTACH or PTRACE_SEIZE from workspace"
    description: "Detects ptrace(2) with PTRACE_ATTACH or PTRACE_SEIZE from a workspace process, attaching to another process as a tracee"
    report: false
    confidence: 0.50
    syscall:
      name: "sys_ptrace"
      args:
        - index: 0
          type: "int"
          values: [16, 16902]  # PTRACE_ATTACH, PTRACE_SEIZE

  - id: "ptrace-sys-ptrace-write"
    name: "ptrace PTRACE_POKETEXT or PTRACE_POKEDATA from workspace"
    description: "Detects ptrace(2) write-style requests (PTRACE_POKETEXT or PTRACE_POKEDATA) from a workspace process, indicative of remote code or data injection"
    report: false
    confidence: 0.80
    syscall:
      name: "sys_ptrace"
      args:
        - index: 0
          type: "int"
          values: [4, 5]  # PTRACE_POKETEXT, PTRACE_POKEDATA

  - id: "nc-reverse-shell-listener"
    name: "Netcat listening for incoming connection"
    description: "Detects nc/ncat/netcat in listening mode inside a pod, potentially waiting for a reverse shell connection from the host or another compromised system"
    report: false
    process: ["nc", "ncat", "netcat"]
    args_match: "any"
    args: ["-l", "lp", "--listen"]

attack_paths:
  - id: "ptrace_remote_code_injection"
    name: "Remote code injection via ptrace"
    description: "ptrace attach followed by code modification of another process from within a workspace"
    time_window: "2m"
    rules:
      - "ptrace-sys-ptrace-attach"
      - "ptrace-sys-ptrace-write"
  
  - id: "ptrace_remote_code_injection_with_nc"
    name: "Remote code injection via ptrace with netcat"
    description: "ptrace attach followed by code modification of another process from within a workspace and netcat listening for incoming connection"
    time_window: "2m"
    rules:
      - "ptrace-sys-ptrace-attach"
      - "ptrace-sys-ptrace-write"
      - "nc-reverse-shell-listener"
