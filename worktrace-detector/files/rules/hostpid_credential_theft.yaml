rules:
  # --- /proc environment variable harvesting ---
  - id: "hostpid-proc-environ-read"
    name: "Access to /proc/*/environ from workspace"
    description: "Detects access to process environment files under /proc, which with hostPID reveals secrets from all host processes"
    report: true
    confidence: 0.80
    file: "/proc/1/environ"

  # --- Kill signal to host processes (DoS) ---
  - id: "hostpid-kill-signal"
    name: "kill command targeting arbitrary PIDs from workspace"
    description: "Detects kill command usage from workspace, which with hostPID can terminate any host process"
    report: false
    confidence: 0.40
    process: "kill"
    args_match: "any"
    args: ["-9", "-KILL", "-SIGKILL", "-TERM", "-SIGTERM"]

  # --- nsenter without full flags (PID-only variant) ---
  - id: "hostpid-nsenter-pid-only"
    name: "nsenter with PID namespace only"
    description: "Detects nsenter targeting PID namespace only, a minimal host PID exploitation"
    report: true
    confidence: 0.75
    process: "nsenter"
    args: ["-t", "-p"]

