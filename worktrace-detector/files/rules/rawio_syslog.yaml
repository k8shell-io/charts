rules:
  - id: "rawio-read-raw-devices"
    name: "Access to /dev/mem, /dev/kmem, or /dev/port from workspace"
    description: "Detects access to /dev/mem, /dev/kmem, or /dev/port from within a workspace, indicative of low-level kernel or hardware access"
    report: true
    confidence: 0.85
    file: ["/dev/mem", "/dev/kmem", "/dev/port"]

  - id: "rawio-sys-io-privilege"
    name: "I/O privilege manipulation syscalls from workspace"
    description: "Detects use of ioperm or iopl syscalls from a workspace process"
    report: true
    confidence: 0.85
    syscall:
      name: ["sys_ioperm", "sys_iopl"]

  - id: "syslog-read-kallsyms"
    name: "Access to /proc/kallsyms from workspace"
    description: "Detects access to /proc/kallsyms, typically used to bypass KASLR when CAP_SYSLOG is present"
    report: false
    confidence: 0.30
    file: "/proc/kallsyms"

  - id: "syslog-read-modules"
    name: "Access to /proc/modules from workspace"
    description: "Detects access to /proc/modules, often combined with /proc/kallsyms for kernel reconnaissance"
    report: false
    confidence: 0.30
    file: "/proc/modules"

attack_paths:
  - id: "syslog_aslr_bypass_combo"
    name: "KASLR bypass via /proc/kallsyms and /proc/modules"
    description: "Combined reads of /proc/kallsyms and /proc/modules from a workspace to enumerate kernel symbols and modules"
    time_window: "10m"
    rules:
      - "syslog-read-kallsyms"
      - "syslog-read-modules"
