# Log Mount Container Escape Detection Rules
# Based on: https://www.aquasec.com/blog/kubernetes-security-pod-escape-log-mounts/
#
# The log mount attack exploits Kubernetes log reading to escape a pod.


rules:
  - id: "pa-logmount-etc-shadow"
    name: "Symlink creation targeting /etc/shadow"
    description: "Detects symlinkat syscall where the linkpath argument contains /etc/shadow, indicating a likely log mount attack to read sensitive files"
    report: true
    confidence: 0.40
    syscall:
      name: "sys_symlinkat"
      args:
        - index: 0
          type: string    # target
          values: ["/etc/passwd", "/etc/shadow"]
          match: "contains_any"
        - index: 1
          type: int       # newdirfd
        - index: 2
          type: string    # linkpath

  # --- Targeted detection (symlinkat with log in linkpath) ---
  # Catches absolute-path usage: ln -s / /var/log/root_link
  - id: "pa-logmount-log-file"
    name: "Symlink creation targeting a log file"
    description: "Detects symlinkat syscall where the linkpath argument is a log file, indicating a likely log mount attack to read sensitive files"
    report: false
    confidence: 0.30
    syscall:
      name: "sys_symlinkat"
      args:
        - index: 0
          type: string    # target
        - index: 1
          type: int       # newdirfd
        - index: 2
          type: string    # linkpath
          values: ["log"]
          match: "contains_any"

  # --- Targeted detection (symlinkat with cwd in log directory) ---
  # Catches relative-path usage: cd /var/log && ln -s / evil_link
  - id: "pa-logmount-varlog-cwd"
    name: "Symlink creation with cwd in log directory"
    description: "Detects symlinkat syscall where the process working directory contains logs, indicating a likely log mount attack using a relative path"
    report: true
    confidence: 0.30
    syscall:
      name: "sys_symlinkat"
      args:
        - index: 0
          type: string    # target
        - index: 1
          type: int       # newdirfd
        - index: 2
          type: string    # linkpath
    cwd: ["log"]

  # --- Rename-based targeting of a log file ---
  # Catches two-step usage such as:
  #   ln -s /etc/shadow /logs/pods/.../0.txt
  #   mv /logs/pods/.../0.txt /logs/pods/.../0.log
  - id: "pa-logmount-mv-log-file"
    name: "Move into a pod log file path"
    description: "Detects mv renaming a file under /logs/pods/ to a .log path, capturing log mount attack variants that first create a temporary symlink and only then rename it to the final log filename"
    report: false
    confidence: 0.20
    process: "mv"
    args:
      - "/logs/pods/"
      - ".log"

attack_paths:
  - id: "pa-logmount-escape"
    name: "Log mount container escape"
    description: "Symlink creation correlated with log file targeting, indicating a log mount attack"
    time_window: "1m"

    rules:
      - "pa-logmount-etc-shadow"
      - "pa-logmount-log-file"

  - id: "pa-logmount-escape-cwd"
    name: "Log mount container escape via cwd"
    description: "Symlink creation from within log directory, indicating a log mount attack using relative paths"
    time_window: "1m"

    rules:
      - "pa-logmount-etc-shadow"
      - "pa-logmount-varlog-cwd"

  - id: "pa-logmount-escape-via-mv"
    name: "Log mount container escape via symlink rename"
    description: "Sensitive-file symlink creation followed by mv into a pod log filename, indicating a rename-based log mount attack"
    time_window: "1m"

    rules:
      - "pa-logmount-etc-shadow"
      - "pa-logmount-mv-log-file"
