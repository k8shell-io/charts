rules:
  - id: "recon-kubectl-get-pods"
    name: "kubectl get pods from workspace"
    description: "Detects kubectl pod enumeration from within a workspace"
    report: false
    confidence: 0.20
    process: "kubectl"
    args: ["get", "pod"]

  - id: "recon-kubectl-get-nodes"
    name: "kubectl get nodes from workspace"
    description: "Detects kubectl node enumeration from within a workspace"
    report: false
    confidence: 0.20
    process: "kubectl"
    args: ["get", "node"]

  - id: "recon-kubectl-auth-can-i"
    name: "kubectl auth can-i permission check"
    description: "Detects kubectl auth can-i used to check RBAC permissions, a key reconnaissance step"
    report: false
    confidence: 0.20
    process: "kubectl"
    args: ["auth", "can-i"]


attack_paths:
  - id: "recon_full_cluster_enum"
    name: "Full Kubernetes cluster enumeration"
    description: "Multiple kubectl reconnaissance commands (pods, nodes, namespaces, permissions) within a short window"
    time_window: "10m"

    rules:
      - "recon-kubectl-get-pods"
      - "recon-kubectl-get-nodes"
      - "recon-kubectl-auth-can-i"