rules:
  # --- Packet capture tools ---
  - id: "hostnet-tcpdump"
    name: "tcpdump execution from workspace"
    description: "Detects tcpdump execution from a workspace, which with hostNetwork can sniff all host traffic"
    report: true
    confidence: 0.85
    process: ["tcpdump", "tshark", "wireshark"]

  - id: "hostnet-network-scan"
    name: "Network scanning tools from workspace"
    description: "Detects nmap or masscan execution from a workspace, indicating network reconnaissance"
    report: true
    confidence: 0.85
    process: ["nmap", "masscan", "zmap"]

  # --- DNS manipulation (CoreDNS poisoning) ---
  - id: "hostnet-coredns-config-access"
    name: "Access to CoreDNS configuration"
    description: "Detects access to CoreDNS configuration files, potential CoreDNS poisoning"
    report: true
    confidence: 0.80
    file: ["/etc/coredns/Corefile", "coredns/Corefile"]

  # --- ARP spoofing tools ---
  - id: "hostnet-arp-spoof"
    name: "ARP spoofing tool execution"
    description: "Detects arpspoof/ettercap execution, indicating L2 network attacks from a workspace with hostNetwork"
    report: true
    confidence: 0.85
    process: ["arpspoof", "ettercap", "bettercap"]
