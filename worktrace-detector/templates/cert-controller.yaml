{{- if .Values.certManager.enabled }}
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: worktrace-controller-cert
spec:
  secretName: worktrace-controller-tls
  duration: {{ .Values.certManager.duration }}
  renewBefore: {{ .Values.certManager.renewBefore }}
  commonName: worktrace-controller.{{ .Release.Namespace }}.svc.cluster.local
  dnsNames:
    - worktrace-controller
    - worktrace-controller.{{ .Release.Namespace }}.svc
    - worktrace-controller.{{ .Release.Namespace }}.svc.cluster.local
  usages:
    - server auth
  issuerRef:
    name: {{ .Values.certManager.issuer.name }}
    kind: {{ .Values.certManager.issuer.kind }}
{{- end }}
