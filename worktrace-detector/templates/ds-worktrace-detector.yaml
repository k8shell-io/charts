{{- $behavioral := dict }}
{{- if .Values.config.detection }}
{{- $behavioral = .Values.config.detection.behavioral | default dict }}
{{- end }}
{{- $baselineDir := "" }}
{{- if and $behavioral.persist_baseline $behavioral.baseline_file }}
{{- $baselineDir = dir $behavioral.baseline_file }}
{{- end }}
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: worktrace-detector
  labels:
    {{- include "worktrace-detector.labels" . | nindent 4 }}
    app.kubernetes.io/component: worktrace-detector
spec:
  selector:
    matchLabels:
      k8shell.io/app: worktrace-detector
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/cm-config.yaml") . | sha256sum }}
        checksum/nats: {{ include (print $.Template.BasePath "/sec-nats.yaml") . | sha256sum }}
      labels:
        k8shell.io/app: worktrace-detector
        {{- include "worktrace-detector.labels" . | nindent 8 }}
    spec:
      hostNetwork: {{ .Values.hostNetwork }}
      {{- if .Values.hostNetwork }}
      # hostNetwork pods only resolve cluster Services (the controller) with this policy
      dnsPolicy: ClusterFirstWithHostNet
      {{- end }}
      {{- include "worktrace-detector.imagePullSecrets" . | nindent 6 }}
      serviceAccountName: worktrace-detector
      containers:
        - name: worktrace-detector
          image: {{ .Values.image.repository }}:{{ .Values.image.tag }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - --config=/etc/worktrace/config.yaml
            - --log-level={{ .Values.logLevel }}
          securityContext:
            runAsUser: 0
            runAsGroup: 0
          env:
            - name: WORKTRACE_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          volumeMounts:
            - name: worktrace-detector-config
              mountPath: /etc/worktrace
              readOnly: true
            - name: jwt
              mountPath: /var/run/secrets/k8shell.io
              readOnly: true
            {{- if .Values.certManager.enabled }}
            - name: ca-cert
              mountPath: /etc/k8shell/ca
              readOnly: true
            {{- end }}
            {{- if $baselineDir }}
            - name: baseline-persistence
              mountPath: {{ $baselineDir }}
            {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: worktrace-detector-config
          configMap:
            name: worktrace-detector-config
        - name: jwt
          projected:
            sources:
              - serviceAccountToken:
                  path: controller
                  audience: worktrace-controller
                  expirationSeconds: {{ .Values.tokenExpiration }}
              {{- include "worktrace-detector.natsPasswordSource" . | nindent 14 }}
        {{- if .Values.certManager.enabled }}
        - name: ca-cert
          secret:
            secretName: worktrace-cluster-ca
        {{- end }}
        {{- if $baselineDir }}
        - name: baseline-persistence
          hostPath:
            path: {{ $baselineDir }}
            type: DirectoryOrCreate
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
