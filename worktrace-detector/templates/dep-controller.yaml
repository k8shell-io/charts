apiVersion: apps/v1
kind: Deployment
metadata:
  name: worktrace-detector-controller
  labels:
    {{- include "worktrace-detector.labels" . | nindent 4 }}
    app.kubernetes.io/component: controller
spec:
  replicas: {{ .Values.controller.replicas }}
  selector:
    matchLabels:
      k8shell.io/app: worktrace-detector-controller
  template:
    metadata:
      annotations:
        checksum/nats: {{ include (print $.Template.BasePath "/sec-nats.yaml") . | sha256sum }}
      labels:
        k8shell.io/app: worktrace-detector-controller
        {{- include "worktrace-detector.labels" . | nindent 8 }}
    spec:
      {{- include "worktrace-detector.imagePullSecrets" . | nindent 6 }}
      serviceAccountName: worktrace-detector-controller
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
      containers:
        - name: controller
          image: {{ .Values.image.repository }}:{{ .Values.image.tag }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - controller
            - --rules-configmap={{ .Values.rules.configMap }}
            - --lease-name=worktrace-detector-controller
            - --owner-clusterrole=worktrace-detector-controller
            - --log-level={{ .Values.logLevel }}
            - --grpc-port=9050
            - --grpc-auth={{ .Values.authEnabled }}
            - --grpc-audience=worktrace-controller
            - --grpc-allow={{ .Release.Namespace }}/worktrace-detector
            - --nats-url=nats://{{ .Values.nats.host }}:{{ .Values.nats.port }}
            - --nats-username={{ .Values.nats.username }}
            - --nats-password-file=/var/run/secrets/k8shell.io/nats-password
            - --threats-replicas={{ .Values.controller.threats.streamReplicas }}
            - --threats-max-age={{ .Values.controller.threats.maxAge }}
            - --threats-dedup-window={{ .Values.controller.threats.dedupWindow }}
            - --threats-warn-confidence={{ .Values.controller.threats.warnConfidence }}
            - --threats-error-confidence={{ .Values.controller.threats.errorConfidence }}
            {{- if .Values.certManager.enabled }}
            - --grpc-tls
            - --grpc-tls-cert=/etc/tls/worktrace-controller/tls.crt
            - --grpc-tls-key=/etc/tls/worktrace-controller/tls.key
            {{- end }}
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          ports:
            - containerPort: 9050
              name: grpc
          volumeMounts:
            - name: secrets
              mountPath: /var/run/secrets/k8shell.io
              readOnly: true
            {{- if .Values.certManager.enabled }}
            - name: controller-cert
              mountPath: /etc/tls/worktrace-controller
              readOnly: true
            {{- end }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            {{- toYaml .Values.controller.resources | nindent 12 }}
      volumes:
        - name: secrets
          projected:
            sources:
              {{- include "worktrace-detector.natsPasswordSource" . | nindent 14 }}
        {{- if .Values.certManager.enabled }}
        - name: controller-cert
          secret:
            secretName: worktrace-controller-tls
        {{- end }}
