apiVersion: apps/v1
kind: Deployment
metadata:
  name: worktrace-detector-controller
  labels:
    {{- include "worktrace-detector.labels" . | nindent 4 }}
    app.kubernetes.io/component: controller
spec:
  replicas: {{ .Values.controller.replicas }}
  selector:
    matchLabels:
      k8shell.io/app: worktrace-detector-controller
  template:
    metadata:
      labels:
        k8shell.io/app: worktrace-detector-controller
        {{- include "worktrace-detector.labels" . | nindent 8 }}
    spec:
      {{- include "worktrace-detector.imagePullSecrets" . | nindent 6 }}
      serviceAccountName: worktrace-detector-controller
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
      containers:
        - name: controller
          image: {{ .Values.image.repository }}:{{ .Values.image.tag }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - controller
            - --rules-configmap=worktrace-detector-rules
            - --lease-name=worktrace-detector-controller
            - --owner-clusterrole=worktrace-detector-controller
            - --log-level={{ .Values.logLevel }}
            - --grpc-port=9050
            - --grpc-auth={{ .Values.authEnabled }}
            - --grpc-audience=worktrace-controller
            - --grpc-allow={{ .Release.Namespace }}/worktrace-detector
            {{- if .Values.certManager.enabled }}
            - --grpc-tls
            - --grpc-tls-cert=/etc/tls/worktrace-controller/tls.crt
            - --grpc-tls-key=/etc/tls/worktrace-controller/tls.key
            {{- end }}
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          ports:
            - containerPort: 9050
              name: grpc
          {{- if .Values.certManager.enabled }}
          volumeMounts:
            - name: controller-cert
              mountPath: /etc/tls/worktrace-controller
              readOnly: true
          {{- end }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            {{- toYaml .Values.controller.resources | nindent 12 }}
      {{- if .Values.certManager.enabled }}
      volumes:
        - name: controller-cert
          secret:
            secretName: worktrace-controller-tls
      {{- end }}
