apiVersion: apps/v1
kind: Deployment
metadata:
  name: worktrace-controller
  labels:
    {{- include "worktrace-detector.labels" . | nindent 4 }}
    app.kubernetes.io/component: controller
spec:
  replicas: {{ .Values.controller.replicas }}
  selector:
    matchLabels:
      k8shell.io/app: worktrace-controller
  template:
    metadata:
      annotations:
        checksum/nats: {{ include (print $.Template.BasePath "/sec-nats.yaml") . | sha256sum }}
        checksum/config: {{ include (print $.Template.BasePath "/cm-controller-config.yaml") . | sha256sum }}
        checksum/secrets: {{ include (print $.Template.BasePath "/sec-controller.yaml") . | sha256sum }}
      labels:
        k8shell.io/app: worktrace-controller
        {{- include "worktrace-detector.labels" . | nindent 8 }}
    spec:
      {{- include "worktrace-detector.imagePullSecrets" . | nindent 6 }}
      serviceAccountName: worktrace-controller
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
      containers:
        - name: controller
          image: {{ .Values.image.repository }}:{{ .Values.image.tag }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - controller
            - --config=/etc/worktrace-controller/config.yaml
            - --log-level={{ .Values.logLevel }}
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          {{- include "worktrace-detector.secretEnv" (dict
            "enabled" .Values.postgresql.enabled
            "name" "POSTGRES_USERNAME"
            "secretDef" .Values.postgresql.username
            "defaultSecret" "worktrace-controller"
            "context" .) | nindent 12 }}
          {{- include "worktrace-detector.secretEnv" (dict
            "enabled" .Values.postgresql.enabled
            "name" "POSTGRES_PASSWORD"
            "secretDef" .Values.postgresql.password
            "defaultSecret" "worktrace-controller"
            "context" .) | nindent 12 }}
          ports:
            - containerPort: 9050
              name: grpc
          volumeMounts:
            - name: config
              mountPath: /etc/worktrace-controller
              readOnly: true
            - name: secrets
              mountPath: /var/run/secrets/k8shell.io
              readOnly: true
            {{- if .Values.certManager.enabled }}
            - name: controller-cert
              mountPath: /etc/tls/worktrace-controller
              readOnly: true
            {{- if .Values.controller.response.rules }}
            - name: ca-cert
              mountPath: /etc/k8shell/ca
              readOnly: true
            {{- end }}
            {{- end }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            {{- toYaml .Values.controller.resources | nindent 12 }}
      volumes:
        - name: config
          configMap:
            name: worktrace-controller-config
        - name: secrets
          projected:
            sources:
              {{- include "worktrace-detector.natsPasswordSource" . | nindent 14 }}
              {{- if .Values.controller.response.rules }}
              # stops workspaces in response to threats (controller.response)
              - serviceAccountToken:
                  path: provisioner
                  audience: provisioner
                  expirationSeconds: {{ .Values.tokenExpiration }}
              {{- end }}
        {{- if .Values.certManager.enabled }}
        - name: controller-cert
          secret:
            secretName: worktrace-controller-tls
        {{- if .Values.controller.response.rules }}
        - name: ca-cert
          secret:
            secretName: worktrace-cluster-ca
        {{- end }}
        {{- end }}
