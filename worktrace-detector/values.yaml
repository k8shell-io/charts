# values.yaml for worktrace-detector Helm chart
#
# worktrace-detector runs the k8shell threat detection engine as a DaemonSet,
# one instance per node. It consumes Tetragon events over gRPC (the pod uses
# hostNetwork to reach Tetragon on the node loopback) and evaluates them
# against the detection rules. Tetragon must be installed in the cluster (the
# TracingPolicy CRD is required by the controller).

image:
  repository: ghcr.io/k8shell-io/worktrace
  tag: v0.1.0
  pullPolicy: IfNotPresent

# imageRegistry defines a private container registry used to create an image pull secret (regcred).
imageRegistry:
  host: ""

  # only one of username/password or existingSecret should be set
  username: ""
  password: ""
  existingSecret: ""

# Enable JWT authentication on the controller's gRPC API: detectors authenticate with
# a projected ServiceAccount token (audience: worktrace-controller).
authEnabled: true

# Lifetime of the projected ServiceAccount token, in seconds
tokenExpiration: 600

# Enable cert-manager to issue the controller's gRPC TLS certificate. This requires
# cert-manager and an issuer (e.g. the same ClusterIssuer the k8shell chart uses).
# If cert-manager is not enabled, TLS is disabled and detectors fall back to plaintext.
certManager:
  enabled: false
  issuer:
    name: vault-root-issuer
    kind: ClusterIssuer
  duration: 24h
  renewBefore: 12h

grpc:
  # enables client-side load balancing between the detectors and the controller
  # replicas; the controller Service becomes headless.
  roundRobin: true

# Log level of the detection engine (debug, info, warn, error)
logLevel: info

# hostNetwork is required to reach Tetragon's gRPC server on the node loopback
hostNetwork: true

resources:
  requests:
    memory: 128Mi
    cpu: 100m
  limits:
    memory: 512Mi
    cpu: "10"

nodeSelector: {}

tolerations:
  - key: CriticalAddonsOnly
    operator: Equal
    value: "true"
    effect: NoExecute

# config is rendered as-is into the engine's config.yaml.
config:
  tetragon:
    # "grpc" for live Tetragon connection, "file" for reading events from a file
    source_mode: grpc
    address: "127.0.0.1:54321"
    connect_timeout: 30s
    max_retries: 5
    retry_delay: 5s

  # Detection rules are not configured here: detectors fetch them from the controller
  # (see rules below). The chart fills in detection.controller itself.
  detection:
    enabled_pipelines:
      - direct
      - correlation
    behavioral:
      learning_duration: 24h
      anomaly_threshold: 0.8
      track_syscalls: true
      track_file_paths: true
      track_processes: true
      # When both are set, baseline_file's directory is persisted on the node (hostPath)
      # persist_baseline: true
      # baseline_file: /var/lib/worktrace/baseline.json

  # Workspace namespace to monitor (exact match)
  namespace: k8shell-workspaces

# nats (JetStream) carries the threats detectors report to the controller. Detectors
# publish every detected threat immediately as it is found, with no batching or
# deduplication on their side: the controller sees every detector's output and decides
# what counts as a duplicate (see controller.threats below). Same server and credentials
# as the k8shell services (the NATS in this namespace).
# the below configuration corresponds to services using NATS in k8shell-bundle and it is
# expected that worktrace detector will be deployed along with services from k8shell-bundle
nats:
  host: nats
  port: 4222
  username: k8shell-service
  password:
    # Use an existing Secret...
    secretName: vault-nats
    secretKey: NATS_K8SHELL_PASSWORD
    # ...or set the password here; the chart then creates the Secret itself.
    value: ""

# rules: this chart ships no detection rules. The controller reads them from a
# ConfigMap in the release namespace that a separate chart or tool provides: one data
# key per rule file (e.g. every *.yaml of rules-v1/ or rules-v2/ in the worktrace
# repository). The controller watches it and serves the rules to the detectors over
# gRPC, so a rule change needs no restart. Until the ConfigMap exists, the controller
# keeps the current TracingPolicy and detectors have no rules.
rules:
  # name of the rules ConfigMap
  configMap: worktrace-detector-rules

# controller owns the detection rules and the Tetragon TracingPolicy. It serves the
# rules to the per-node detectors over gRPC (port 9050) and generates the TracingPolicy
# (cilium.io/v1alpha1) from the rules ConfigMap, keeping both in sync whenever the rules
# change. It runs as a separate Deployment (same image, `controller` command): every
# replica serves rules, and leader election ensures only one replica writes the policy,
# so the detectors need no access to cluster-scoped policies. Detectors without a
# reachable controller have no rules and detect nothing.
controller:
  replicas: 2
  # how often detectors check the controller for new rules
  pollInterval: 30s
  requestTimeout: 10s
  # The controller creates the WORKTRACE_THREATS stream the detectors publish to and
  # consumes it (every replica shares one durable consumer, so each threat is handled
  # once). Within dedupWindow, threats from the same process (e.g. nsenter matching a
  # name rule and the setns syscall rule) raise one alert: the first is reported and
  # the rest are logged as "threat_merged" unless they raise the confidence. Repeated
  # attack-path threats for the same rule+workspace are suppressed after the first
  # (which is always reported immediately) and folded into a summary once the window
  # elapses. Set dedupWindow to 0s to report every occurrence individually instead. Each threat is printed as a JSON line on stdout,
  # leveled by confidence: below warnConfidence is info, at/above errorConfidence is
  # error, otherwise warn.
  threats:
    # replicas of the stream and of the shared dedup state; must not exceed the NATS
    # cluster size
    streamReplicas: 3
    # how long the stream retains threats
    maxAge: 24h
    dedupWindow: 60s
    warnConfidence: 0.5
    errorConfidence: 0.85
  resources:
    requests:
      memory: 32Mi
      cpu: 10m
    limits:
      memory: 128Mi
      cpu: 200m
