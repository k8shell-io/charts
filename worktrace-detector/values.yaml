# values.yaml for worktrace-detector Helm chart
#
# worktrace-detector runs the k8shell threat detection engine as a DaemonSet,
# one instance per node. It consumes Tetragon events over gRPC (the pod uses
# hostNetwork to reach Tetragon on the node loopback) and evaluates them
# against the detection rules. Tetragon must be installed in the cluster (the
# TracingPolicy CRD is required by the controller).

image:
  repository: ghcr.io/k8shell-io/worktrace
  tag: v0.1.0
  pullPolicy: IfNotPresent

# imageRegistry defines a private container registry used to create an image pull secret (regcred).
imageRegistry:
  host: ""

  # only one of username/password or existingSecret should be set
  username: ""
  password: ""
  existingSecret: ""

# Enable JWT authentication on the controller's gRPC API: detectors authenticate with
# a projected ServiceAccount token (audience: worktrace-controller).
authEnabled: true

# Lifetime of the projected ServiceAccount token, in seconds
tokenExpiration: 600

# Enable cert-manager to issue the controller's gRPC TLS certificate. This requires
# cert-manager and an issuer (e.g. the same ClusterIssuer the k8shell chart uses).
# If cert-manager is not enabled, TLS is disabled and detectors fall back to plaintext.
certManager:
  enabled: false
  issuer:
    name: vault-root-issuer
    kind: ClusterIssuer
  duration: 24h
  renewBefore: 12h

grpc:
  # enables client-side load balancing between the detectors and the controller
  # replicas; the controller Service becomes headless.
  roundRobin: true

# Log level of the detection engine (debug, info, warn, error)
logLevel: info

# hostNetwork is required to reach Tetragon's gRPC server on the node loopback
hostNetwork: true

resources:
  requests:
    memory: 128Mi
    cpu: 100m
  limits:
    memory: 512Mi
    cpu: "10"

nodeSelector: {}

tolerations:
  - key: CriticalAddonsOnly
    operator: Equal
    value: "true"
    effect: NoExecute

# config is rendered as-is into the engine's config.yaml.
config:
  tetragon:
    # "grpc" for live Tetragon connection, "file" for reading events from a file
    source_mode: grpc
    address: "127.0.0.1:54321"
    connect_timeout: 30s
    max_retries: 5
    retry_delay: 5s

  # Detection rules are not configured here: detectors fetch them from the controller
  # (see rules below). The chart fills in detection.controller itself.
  detection:
    enabled_pipelines:
      - direct
      - correlation
    behavioral:
      learning_duration: 24h
      anomaly_threshold: 0.8
      track_syscalls: true
      track_file_paths: true
      track_processes: true
      # When both are set, baseline_file's directory is persisted on the node (hostPath)
      # persist_baseline: true
      # baseline_file: /var/lib/worktrace/baseline.json

  aggregator:
    # "logs" for structured stderr output (collected by Loki), "file" for JSON file output
    output_mode: logs
    batch_size: 100
    batch_timeout: 5s

  # Workspace namespace to monitor (exact match)
  namespace: k8shell-workspaces

# rules are stored in a ConfigMap read by the controller, which serves them to the
# detectors over gRPC and polls for changes: a rule change needs no detector restart.
rules:
  # Include the bundled detection rules from files/rules/
  includeDefaults: true

  # Additional rules; map of file name to rule YAML content, e.g.
  # extra:
  #   my_rule.yaml: |
  #     ...
  extra: {}

# controller owns the detection rules and the Tetragon TracingPolicy. It serves the
# rules to the per-node detectors over gRPC (port 9050) and generates the TracingPolicy
# (cilium.io/v1alpha1) from the rules ConfigMap, keeping both in sync whenever the rules
# change. It runs as a separate Deployment (same image, `controller` command): every
# replica serves rules, and leader election ensures only one replica writes the policy,
# so the detectors need no access to cluster-scoped policies. Detectors without a
# reachable controller have no rules and detect nothing.
controller:
  replicas: 2
  # how often detectors check the controller for new rules
  pollInterval: 30s
  requestTimeout: 10s
  resources:
    requests:
      memory: 32Mi
      cpu: 10m
    limits:
      memory: 128Mi
      cpu: 200m
